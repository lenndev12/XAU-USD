name: XAUUSD ORB Signal Bot

on:
  schedule:
    # London window: Brussels 09:30-12:00 = UTC 07:30-10:00
    - cron: '*/5 7-12 * * 1-5'
    # NY window: Brussels 16:00-19:00 = UTC 14:00-17:00
    - cron: '*/5 14-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write  # Nodig om trades.json te schrijven naar repo

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run signal bot
        env:
          TWELVEDATA_KEY:    ${{ secrets.TWELVEDATA_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python signal_bot.py
